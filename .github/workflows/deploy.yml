name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and verify the deployment origin.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate static assets
        run: |
          set -e
          echo "Checking required files..."
          for f in index.html basics.html soil.html plants.html care.html advanced.html planner.html 404.html \
                   assets/css/style.css assets/js/app.js assets/js/plants-data.js; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done
          echo "All required files present."
          echo "Plant entries: $(grep -c '"name":' assets/js/plants-data.js)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
